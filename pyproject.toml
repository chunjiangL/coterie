[project]
name = "dc-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0",
    "slack-bolt>=1.20.0",
    "anthropic>=0.101.0",
    "openai>=1.55.0",
    "mem0ai>=0.1.50",
    "python-dotenv>=1.0.0",
    "chromadb>=0.4.24",
    "sentence-transformers>=2.7.0",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
]

[tool.setuptools]
py-modules = [
    "bot",
    "slack_bot",
    "memory",
    "backends",
    "config",
    "web_fetch",
    "agent",
    "agent_openai",
    "annotator",
    "annotator_openai",
    "digest",
    "digest_openai",
    "user_profile",
    "user_profile_openai",
    "proactive",
    "proactive_openai",
]
